status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.cyberlions-ita.eu
  # baseUrl: /status
  logoUrl: /cyberlions-logo.png
  name: CyberLions · Stato dei servizi
  favicon: /favicon.ico
  introTitle: '<span class="cl-eyebrow">CYBERLIONS / STATO DEI SERVIZI</span>Il punto sui<br><em>nostri servizi.</em>'
  introMessage: "Disponibilità, tempi di risposta e aggiornamenti sui servizi della community. Tutte le informazioni per ritrovarci, anche quando qualcosa non va."
  theme: night
  # Loaded after Upptime's styles; assets/ is copied to the website root.
  links:
    - rel: stylesheet
      href: /cyberlions.css
  customHeadHtml: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;display=swap">
  metaTags:
    - name: theme-color
      content: "#131211"
    - name: color-scheme
      content: dark
    - name: description
      content: "Lo stato dei servizi CyberLions: disponibilità, tempi di risposta, incidenti e manutenzioni della community gaming italiana."
  navbar:
    - title: Stato dei servizi
      href: /
    - title: Community ↗
      href: https://cyberlions-ita.eu/
    - title: GitHub
      href: https://github.com/CyberLions-Italian-Community/status

